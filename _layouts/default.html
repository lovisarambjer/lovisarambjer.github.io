<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site.title }}</title>
    <meta name="description" content="{{ site.description }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <div class="wrapper">
      <header>
        <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
        {% if site.logo %}<img src="{{ site.logo | relative_url }}" alt="{{ site.title }}">{% endif %}
        <p>{{ site.description }}</p>
        <nav class="sidebtns">
          <a class="sidebtn" href="mailto:YOUR.EMAIL@ifau.se">Email</a>
          <a class="sidebtn" href="{{ '/cv_Lovisa_Rambjer.pdf' | relative_url }}">Download CV</a>
          <!-- Remove the comment markers and add your links to show more buttons:
          <a class="sidebtn" href="GOOGLE_SCHOLAR_URL">Google Scholar</a>
          <a class="sidebtn" href="https://github.com/lovisarambjer">GitHub</a>
          <a class="sidebtn" href="LINKEDIN_URL">LinkedIn</a>
          -->
        </nav>
      </header>

      <section id="home">
        {{ content }}
      </section>
    </div>

    <script>
      // "Show abstract" toggles
      document.querySelectorAll('.abs-toggle').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var panel = btn.closest('.links').nextElementSibling;
          var open = btn.getAttribute('aria-expanded') === 'true';
          btn.setAttribute('aria-expanded', String(!open));
          btn.textContent = open ? 'Show abstract' : 'Hide abstract';
          panel.hidden = open;
        });
      });
    </script>
  </body>
</html>
